server:
  port: ${SANGUI_SECKILL_PORT:8103}

spring:
  application:
    name: sangui-seckill
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${SANGUI_SECKILL_MYSQL_SCHEMA:sangui_seckill}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:sangui_app}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: ${SANGUI_SECKILL_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    default-schema: ${SANGUI_SECKILL_MYSQL_SCHEMA:sangui_seckill}
    schemas:
      - ${SANGUI_SECKILL_MYSQL_SCHEMA:sangui_seckill}
    baseline-on-migrate: false
    validate-on-migrate: true
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}

sangui:
  service:
    domain: seckill
  shop:
    default-shop-id: ${SANGUI_DEFAULT_SHOP_ID:1}
  client:
    product:
      base-url: ${SANGUI_PRODUCT_SERVICE_BASE_URL:http://localhost:8102}
      connect-timeout-ms: ${SANGUI_PRODUCT_SERVICE_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${SANGUI_PRODUCT_SERVICE_READ_TIMEOUT_MS:3000}
  infrastructure:
    mysql:
      schema: ${SANGUI_SECKILL_MYSQL_SCHEMA:sangui_seckill}
      host: ${MYSQL_HOST:localhost}
      port: ${MYSQL_PORT:3306}
      username: ${MYSQL_USERNAME:sangui_app}
      password: ${MYSQL_PASSWORD:}
    redis:
      key-prefix: sangui:${SANGUI_ENV:local}:seckill
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    mq:
      name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
      topics:
        seckill-order-requested: sangui.seckill.order.requested

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
