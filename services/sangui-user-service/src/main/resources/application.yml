server:
  port: ${SANGUI_USER_PORT:8101}

spring:
  application:
    name: sangui-user
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${SANGUI_USER_MYSQL_SCHEMA:sangui_user}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:sangui_app}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: ${SANGUI_USER_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    default-schema: ${SANGUI_USER_MYSQL_SCHEMA:sangui_user}
    schemas:
      - ${SANGUI_USER_MYSQL_SCHEMA:sangui_user}
    baseline-on-migrate: false
    validate-on-migrate: true
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}

sangui:
  service:
    domain: user
  shop:
    default-shop-id: ${SANGUI_DEFAULT_SHOP_ID:1}
  security:
    jwt:
      secret: ${SANGUI_JWT_SECRET:}
      ttl-seconds: ${SANGUI_JWT_TTL_SECONDS:7200}
  infrastructure:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
    mysql:
      schema: ${SANGUI_USER_MYSQL_SCHEMA:sangui_user}
      host: ${MYSQL_HOST:localhost}
      port: ${MYSQL_PORT:3306}
      username: ${MYSQL_USERNAME:sangui_app}
      password: ${MYSQL_PASSWORD:}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    mq:
      name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
