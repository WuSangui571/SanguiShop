server:
  port: ${SANGUI_ORDER_PORT:8104}

spring:
  application:
    name: sangui-order
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${SANGUI_ORDER_MYSQL_SCHEMA:sangui_order}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:sangui_app}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: ${SANGUI_ORDER_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    default-schema: ${SANGUI_ORDER_MYSQL_SCHEMA:sangui_order}
    schemas:
      - ${SANGUI_ORDER_MYSQL_SCHEMA:sangui_order}
    baseline-on-migrate: false
    validate-on-migrate: true
  config:
    import: optional:nacos:${spring.application.name}.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}

sangui:
  service:
    domain: order
  client:
    product:
      base-url: ${SANGUI_PRODUCT_BASE_URL:http://localhost:8102}
      connect-timeout-ms: ${SANGUI_PRODUCT_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${SANGUI_PRODUCT_READ_TIMEOUT_MS:3000}
  shop:
    default-shop-id: ${SANGUI_DEFAULT_SHOP_ID:1}
  uploads:
    review-images:
      storage-directory: ${SANGUI_REVIEW_IMAGE_STORAGE_DIRECTORY:./data/uploads/review-images}
      public-base-path: ${SANGUI_REVIEW_IMAGE_PUBLIC_BASE_PATH:/api/uploads/review-images}
      max-file-size-bytes: ${SANGUI_REVIEW_IMAGE_MAX_FILE_SIZE_BYTES:5242880}
  compensation:
    order-timeout:
      enabled: ${SANGUI_ORDER_TIMEOUT_COMPENSATION_ENABLED:false}
      shop-id: ${SANGUI_ORDER_TIMEOUT_COMPENSATION_SHOP_ID:${SANGUI_DEFAULT_SHOP_ID:1}}
      timeout-minutes: ${SANGUI_ORDER_TIMEOUT_COMPENSATION_TIMEOUT_MINUTES:15}
      limit: ${SANGUI_ORDER_TIMEOUT_COMPENSATION_LIMIT:100}
      initial-delay-ms: ${SANGUI_ORDER_TIMEOUT_COMPENSATION_INITIAL_DELAY_MS:15000}
      fixed-delay-ms: ${SANGUI_ORDER_TIMEOUT_COMPENSATION_FIXED_DELAY_MS:60000}
  infrastructure:
    mysql:
      schema: ${SANGUI_ORDER_MYSQL_SCHEMA:sangui_order}
      host: ${MYSQL_HOST:localhost}
      port: ${MYSQL_PORT:3306}
      username: ${MYSQL_USERNAME:sangui_app}
      password: ${MYSQL_PASSWORD:}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    mq:
      name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
      topics:
        seckill-order-requested: sangui.seckill.order.requested
        order-created: sangui.order.created
        order-timeout-cancelled: sangui.order.timeout.cancelled

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
