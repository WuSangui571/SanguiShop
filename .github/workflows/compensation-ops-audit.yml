name: Compensation Ops Audit

on:
  workflow_dispatch:
    inputs:
      service:
        description: Compensation service test scope
        required: true
        default: all
        type: choice
        options:
          - all
          - order
          - payment

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure Maven Wrapper is executable
        shell: bash
        run: chmod +x ./mvnw

      - name: Run compensation ops audit controller tests
        shell: pwsh
        run: ./scripts/verify-compensation-ops-audit.ps1 -Service ${{ inputs.service }}
