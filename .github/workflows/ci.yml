name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure Maven Wrapper is executable
        run: chmod +x ./mvnw

      - name: Run tests
        run: ./mvnw -q test

      - name: Package without tests
        run: ./mvnw -q -DskipTests package

      - name: Validate Docker Compose configuration
        run: docker compose -f deploy/docker-compose.yml config
